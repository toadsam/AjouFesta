# 푸시와 PR 마다 서버 테스트와 화면 빌드를 돈다. 배포는 하지 않는다.
# 서버 테스트 127개 중 동시 주문 테스트 4개는 Testcontainers 로 PostgreSQL 을 띄운다(러너에 Docker 가 있다).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 서버 테스트 (Java 17 · PostgreSQL 컨테이너)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon --console=plain
      - name: 동시 주문 시험 결과
        if: always()
        run: cat build/concurrency-results.tsv || true
      - name: 테스트 보고서 올리기 (실패했을 때)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test
          if-no-files-found: ignore

  frontend:
    name: 화면 빌드 (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 잠금 파일은 Windows 에서 만들어져 리눅스용 선택 의존성(@emnapi/*)이 빠져 있다. npm ci 는 그 차이로 멈추므로 install 을 쓴다.
      - run: npm install --no-audit --no-fund
      - run: npm run build
