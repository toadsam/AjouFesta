plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.festflow'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

tasks.named("bootRun") {
    def activeProfile = System.getProperty("spring.profiles.active")
    if (!activeProfile) {
        activeProfile = System.getenv("SPRING_PROFILES_ACTIVE")
    }
    systemProperty "spring.profiles.active", activeProfile ?: "local"
}

repositories {
    mavenCentral()
}

// Spring Boot 3.3 이 고정한 Testcontainers(1.19)는 최신 Docker 엔진(API 1.44 이상만 받는 버전)에 붙지 못한다.
// GitHub Actions 러너에서 그 때문에 OrderConcurrencyTest 가 시작도 못 했다. 붙는 버전으로 올린다.
ext['testcontainers.version'] = '1.21.4'

dependencies {
    implementation platform('software.amazon.awssdk:bom:2.25.70')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'software.amazon.awssdk:s3'
    implementation 'net.nurigo:sdk:4.3.2'
    implementation 'com.twilio.sdk:twilio:10.6.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 동시 주문 테스트(OrderConcurrencyTest)가 실제 PostgreSQL 의 행 잠금을 쓴다. Docker 가 있어야 돈다.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

