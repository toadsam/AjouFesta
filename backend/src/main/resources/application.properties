spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/festival_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}

server.port=${PORT:8080}
server.error.include-message=always
# JSON 응답을 압축해 보낸다(부스 목록 60KB -> 약 6KB). SSE(text/event-stream)는 대상이 아니다.
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/csv
server.compression.min-response-size=1024
# DB 연결 풀. 기본 10개는 동시 접속이 몰리면 금방 찬다. Railway Postgres 기본 최대 연결(100) 안쪽으로 둔다.
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:24}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:25MB}

app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.storage.type=${APP_STORAGE_TYPE:local}
app.s3.bucket=${AWS_S3_BUCKET:}
app.s3.region=${AWS_REGION:ap-northeast-2}
app.s3.endpoint=${AWS_S3_ENDPOINT:}
app.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
app.s3.path-style-access=${AWS_S3_PATH_STYLE_ACCESS:false}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*}
# 테이블 QR 주문 최소 금액(원). 이보다 적으면 주문을 받지 않는다. 0 이면 제한 없음.
app.order.min-amount=${APP_ORDER_MIN_AMOUNT:14000}
app.ops.master-key=${APP_OPS_MASTER_KEY:}
app.ops.booth-keys=${APP_OPS_BOOTH_KEYS:}
app.ops.shared-booth-key=${APP_OPS_SHARED_BOOTH_KEY:}
app.simulation.enabled=${APP_SIMULATION_ENABLED:false}
app.staff.demo-login.enabled=${APP_STAFF_DEMO_LOGIN_ENABLED:false}
app.sms.provider=${APP_SMS_PROVIDER:none}
app.sms.max-verify-attempts=${APP_SMS_MAX_VERIFY_ATTEMPTS:5}
app.sms.twilio.account-sid=${APP_SMS_TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${APP_SMS_TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${APP_SMS_TWILIO_FROM_NUMBER:}
app.sms.aligo.api-key=${APP_SMS_ALIGO_API_KEY:}
app.sms.aligo.user-id=${APP_SMS_ALIGO_USER_ID:}
app.sms.aligo.sender=${APP_SMS_ALIGO_SENDER:}
app.sms.aligo.test-mode=${APP_SMS_ALIGO_TEST_MODE:false}
app.sms.solapi.api-key=${APP_SOLAPI_API_KEY:}
app.sms.solapi.api-secret=${APP_SOLAPI_API_SECRET:}
app.sms.solapi.api-base-url=${APP_SOLAPI_API_BASE_URL:https://api.solapi.com}
app.sms.solapi.from=${APP_SOLAPI_FROM:}
app.ai-match.sms.enabled=${APP_AI_MATCH_SMS_ENABLED:true}
app.init.demo-data=${APP_INIT_DEMO_DATA:true}
# 동시에 돌리는 AI 프로필 그림 변환 수.
app.ai-match.image.max-concurrent=${APP_AI_MATCH_IMAGE_MAX_CONCURRENT:12}
app.init.admin.username=${APP_INIT_ADMIN_USERNAME:}
app.init.admin.password=${APP_INIT_ADMIN_PASSWORD:}
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-5-mini}
app.openai.image-model=${OPENAI_IMAGE_MODEL:gpt-image-1.5}
app.ai-match.photo-validation.enabled=${APP_AI_MATCH_PHOTO_VALIDATION_ENABLED:true}
app.ml.congestion.enabled=${APP_ML_CONGESTION_ENABLED:true}
app.ml.python-command=${APP_ML_PYTHON_COMMAND:python3}
app.ml.congestion.predict-script=${APP_ML_CONGESTION_PREDICT_SCRIPT:./scripts/ml/predict_congestion.py}
app.ml.congestion.model-path=${APP_ML_CONGESTION_MODEL_PATH:./exports/ml/models/random_forest_congestion_model.pkl}
app.ml.congestion.portable-model-path=${APP_ML_CONGESTION_PORTABLE_MODEL_PATH:./exports/ml/models/random_forest_congestion_model.json}
app.ml.congestion.timeout-ms=${APP_ML_CONGESTION_TIMEOUT_MS:20000}
# 자리 예약(전화 인증·예약·체크인). 이번 축제는 워크인만 받아 기본 꺼짐.
app.reservations.enabled=${APP_RESERVATIONS_ENABLED:false}
# 손님 화면 주소. 문자 속 링크에 쓴다.
app.public-url=${APP_PUBLIC_URL:https://fest-flow-smoky.vercel.app}
